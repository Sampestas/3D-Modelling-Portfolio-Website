<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Sampestas - 3D-Modeler Portfolio</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="data:,">
        <link rel="stylesheet" href="css/main.css">
    </head>
    <body>
        <header class="site-header">
            <a href="#" class="brand-link" aria-label="Homepage">
                <img src="assets/images/website_logo_portfolio.png" alt="Logo" class="logo-img">
                <strong class="nickname">Sampestas<span class="highlight">.</span></strong>
            </a>

            <nav class="navigation">
                <ul class="nav-list">
                    <li><a href="#about" class="nav-link">About</a></li>
                    <li><a href="#services" class="nav-link">Services</a></li>
                    <li><a href="#portfolio" class="nav-link">Portfolio</a></li>
                    <li><a href="#contact" class="nav-link">Contact</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section id="portfolio" aria-labelledby="portfolio-heading">
                <header class="section-header">
                    <h2 id="portfolio-heading">My Showcase<span class="highlight">.</span></h2>
                    <p>A collection of props, environments, and clean topology built natively inside Blender.</p>
                </header>

                <div class="bento-grid">
                    
                    <!-- Project 1: Environment Design Feature -->
                    <figure class="bento-item wide featured">
                        <div class="card-media">
                            <img src="assets/images/hero_render.jpg" alt="High fidelity render of a Cyberpunk Street Scene Environment with neon illumination" loading="lazy">
                        </div>
                        <figcaption class="card-info">
                            <span class="category">Environment Design</span>
                            <h3>Neon Alleyway Project</h3>
                        </figcaption>
                    </figure>

                    <!-- Project 2: Character Topology Toggle Display -->
                    <figure class="bento-item tall interactive-wire">
                        <div class="card-media item-dual-layer">
                            <img src="assets/images/character_render.jpg" alt="Final textured model render of Mech Warrior character" class="render-view">
                            <img src="assets/images/character_wire.jpg" alt="Wireframe polygon wire display showcasing the clean sub-d topology of the Mech Warrior character" class="wire-view">
                        </div>
                        <figcaption class="card-info">
                            <span class="category">Character Model</span>
                            <h3>Mech Warrior (Hover/Tap for Wireframe)</h3>
                        </figcaption>
                    </figure>

                    <!-- Project 3: Vertical Asset Breakdown -->
                    <figure class="bento-item tall">
                        <div class="card-media">
                            <img src="assets/images/sword_prop.jpg" alt="Detailed close-up render of a high poly Crystalline Greatsword weapon asset" loading="lazy">
                        </div>
                        <figcaption class="card-info">
                            <span class="category">Prop Modeling</span>
                            <h3>Crystalline Greatsword</h3>
                        </figcaption>
                    </figure>

                    <!-- Project 4: Material Shading Node Display -->
                    <figure class="bento-item">
                        <div class="card-media">
                            <img src="assets/images/material_sphere.jpg" alt="Procedural texture preview sphere displaying custom procedural metal and grime smart materials" loading="lazy">
                        </div>
                        <figcaption class="card-info">
                            <span class="category">Procedural Shading</span>
                            <h3>Smart Materials</h3>
                        </figcaption>
                    </figure>

                    <!-- Project 5: Vehicle Concept Model -->
                    <figure class="bento-item wide">
                        <div class="card-media">
                            <img src="assets/images/vehicle_render.jpg" alt="Hard surface render showcasing a complex Sci-Fi Fighter Drone vehicle model" loading="lazy">
                        </div>
                        <figcaption class="card-info">
                            <span class="category">Hard Surface</span>
                            <h3>Sci-Fi Fighter Drone</h3>
                        </figcaption>
                    </figure>
                </div>
            </section>
        </main>
    </body>
</html>
